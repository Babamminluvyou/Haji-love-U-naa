<!DOCTYPE html>
<html lang="th">

<head>

    <meta charset="UTF-8">

    <meta

    >

    <title>มีอะไรจะบอก 🐾</title>

    <link
        rel="stylesheet"
        href="style.css"

</head>

<body>

    <main class="scene">

        <!-- แมว -->
        <div id="cat" class="cat">
            🐱
        </div>

        <!-- คำพูด -->

            เมี๊ยววว~ 🐱
            <br>

            เอาหูมานี่ มีไรจะบอก

        </div>


        <!-- ฉากจดหมาย -->

        <div id="letterScene" class="letter-scene-content">

            <div class="paw">
                🐾
            </div>

            <div class="letter">

                <div class="letter-icon">
                    💌
                </div>

                <p>
                    ลองเปิดดูจิ<br>
                    มีไรจะบอก
                </p>

                <button id="openLetter">
                    เปิดดู 💗
                </button>

            </div>

        </div>

    </main>


    <script src="script.js"></script>

</body>

</html>
